  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Einsatzzentrale (SHS-EZ)</title>
    <meta name="description" content="Taktisches Einsatzleitsystem für Vermisstensuchen mit GPS-Echtzeit-Tracking, Suchsektoren, Drohnen/Hunde-Einsatz, Fundmeldungen und Einsatzarchiv." />
    <meta property="og:title" content="Einsatzzentrale (SHS-EZ)" />
    <meta property="og:description" content="Taktisches Einsatzleitsystem für Vermisstensuchen mit GPS-Echtzeit-Tracking, Suchsektoren, Drohnen/Hunde-Einsatz, Fundmeldungen und Einsatzarchiv." />
    
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/icon-512.png" />
    <link rel="icon" type="image/svg+xml" href="/assets/icon-192.svg" />
    <link rel="shortcut icon" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/icon-192.png" />
    <meta name="theme-color" content="#0F172A" />

    <script>
      // Force purge outdated ServiceWorker caches when a major build deployment lands
      (function() {
        var CURRENT_VERSION = '2026-09-11-v6-barcode-fix';
        var storedVersion = localStorage.getItem('shs_ez_cache_version');

        if (storedVersion !== CURRENT_VERSION) {
          localStorage.setItem('shs_ez_cache_version', CURRENT_VERSION);
          
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) {
                regs[i].unregister();
              }
            }).catch(function(){});
          }

          if ('caches' in window) {
            caches.keys().then(function(keys) {
              for (var j = 0; j < keys.length; j++) {
                caches.delete(keys[j]);
              }
            }).catch(function(){});
          }

          if (storedVersion) {
            window.location.reload();
          }
        }
      })();

      // Global error listener to prevent blank screen and show diagnostics
      window.addEventListener('error', function(e) {
        console.error('[BOOT-ERROR]', e);
      });

      // Capture beforeinstallprompt early to ensure PWA installation trigger is never missed
      window.deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.deferredPWAInstallPrompt = e;
      });

      // Apply dark mode early to prevent FOUC (default to dark for tactical EZ interface)
      if (localStorage.theme === 'light') {
        document.documentElement.classList.remove('dark');
      } else {
        document.documentElement.classList.add('dark');
      }
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
